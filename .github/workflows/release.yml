name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NetCid.sln --locked-mode --tl:off

      - name: Build
        run: dotnet build NetCid.sln -c Release --no-restore --tl:off

      - name: Test (Unit)
        run: dotnet test NetCid.Tests/NetCid.Tests.csproj -c Release --no-build --tl:off

      - name: Test (Integration)
        run: dotnet test NetCid.IntegrationTests/NetCid.IntegrationTests.csproj -c Release --no-build --tl:off

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          # Publishing is only valid from a tag ref. A workflow_dispatch launched from a
          # branch (the dispatch default) used to skip this check with exit 0 and publish
          # whatever <Version> the csproj carried, with no tag/version correspondence
          # enforced — fail closed instead (#46). Dispatching against a tag still works:
          # it yields GITHUB_REF_TYPE=tag and takes the verification path below.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release publish requires a tag ref; got ${GITHUB_REF_TYPE}=${GITHUB_REF_NAME}. Push a v* tag (or dispatch against one)."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' NetCid/NetCid.csproj | head -1)"
          echo "tag=$tag csproj=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::Tag v$tag does not match <Version> $ver"; exit 1; }

      - name: Pack
        # ref_type gate: defense-in-depth so Pack/Publish cannot run from a non-tag ref
        # even if the guard step above is ever edited or removed (#46).
        if: github.ref_type == 'tag'
        run: dotnet pack NetCid/NetCid.csproj -c Release --no-build -o artifacts --tl:off

      - name: Publish NuGet Packages
        if: github.ref_type == 'tag'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          # No --skip-duplicate: re-publishing an already-published version must fail
          # loudly (NuGet 409) rather than exit 0, preserving the fail-fast intent of
          # the tag/version guard (#46). If a partial publish ever needs a retry after
          # the .nupkg landed but the .snupkg did not, push the .snupkg manually.
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json"

          dotnet nuget push "artifacts/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json"
