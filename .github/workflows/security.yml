name: security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NetCid.sln --locked-mode --tl:off

      - name: NuGet Vulnerability Scan (gated)
        run: |
          set -euo pipefail
          out="$(dotnet list NetCid.sln package --vulnerable --include-transitive)"
          echo "$out"
          if printf '%s\n' "$out" | grep -qiF 'has the following vulnerable packages'; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi
