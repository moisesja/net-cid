name: security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NetCid.sln --locked-mode --tl:off

      - name: NuGet Vulnerability Scan (gated)
        # `dotnet list package --vulnerable` exits 0 even when it reports
        # advisories, so the build is gated on the command's OUTPUT. We fail on
        # either of two signals that appear only when packages are actually
        # vulnerable: the summary header, and the per-advisory GitHub URL. The
        # advisory URL is locale-independent and survives a header rewording, so
        # it guards against a silent fail-open if a future SDK changes the
        # wording. DOTNET_CLI_UI_LANGUAGE=en additionally pins the output
        # language so a non-en runner locale cannot reword the header out from
        # under the match. Sentinels verified against .NET SDK 10.0.100; if a
        # future SDK reworks both the header and the advisory-URL format,
        # re-verify the patterns below.
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          set -euo pipefail
          out="$(dotnet list NetCid.sln package --vulnerable --include-transitive)"
          echo "$out"
          if printf '%s\n' "$out" | grep -qiE 'has the following vulnerable packages|https?://github\.com/advisories/'; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi
